[build]
  publish = "."

# No build command — static site + serverless functions

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "microphone=(), camera=()"

# Service worker must not be long-cached so updates deploy immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json; charset=utf-8"

# Icons — immutable (change filename to bust cache if updated)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio files — long-lived cache (filename includes phrase ID, never changes)
[[headers]]
  for = "/audio/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate (covers both "/" and "/index.html")
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
